[package]
name = "tauri-plugin-retroarch-launcher"
version = "0.1.0"
description = "Tiny Android-only Tauri bridge that launches RetroArch content"
edition = "2021"
license = "MIT"
repository = "https://github.com/androidgyny/exodium-pocket"
links = "tauri-plugin-retroarch-launcher"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
thiserror = "2"
